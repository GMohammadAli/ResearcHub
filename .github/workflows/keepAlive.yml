name: Keep Render Services Alive

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes
  workflow_dispatch:         # allow manual run

jobs:
  ping:
    runs-on: ubuntu-latest

    env:
      SERVER_URL: ${{ secrets.SERVER_URL }}
      AI_ENGINE_URL: ${{ secrets.AI_ENGINE_URL }}

    steps:
      - name: Ping researchub-server
        run: |
          echo "Checking status researchub-server..."
          curl -fsS --max-time 10 "$SERVER_URL/chat/health" || echo "❌ researchub-server health check failed"

      - name: Ping researchub-ai-engine
        run: |
          echo "Checking status researchub-ai-engine..."
          curl -fsS --max-time 10 "$AI_ENGINE_URL/summarize/health" || echo "❌ researchub-ai-engine health check failed"
